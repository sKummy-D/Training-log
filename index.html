<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Training Log</title>
<meta name="description" content="A 3-day training log built for Planet Fitness equipment." />

<!-- installs to the home screen and opens without browser chrome -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Training Log" />
<meta name="theme-color" content="#17181B" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; background: #17181B; }
  body {
    font-family: 'Barlow', system-ui, -apple-system, sans-serif;
    color: #ECEAE4;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #root { min-height: 100vh; }
  #boot { display: grid; place-items: center; min-height: 100vh; color: #6E7178; font-size: 14px; }
</style>
</head>

<div id="root"><div id="boot">Loading your log…</div></div>

 to push your threshold, short enough to repeat seven times.",B:"Steady incline walking. Hardest on the calves and glutes, easiest on the joints, and the best calorie burn per minute here.",C:"Run/walk builds distance faster than trying to run straight through. The walk is deliberately shorter than the run.",D:"Genuine recovery. Blood flow without fatigue \u2014 this is the one that lets the other days stay hard."},Zl=[{key:"cardio",name:"Cardio",sub:"Monday \xB7 treadmill, pick one",color:a.yellow},{key:"upper",name:"Upper Body",sub:"Wednesday \xB7 chest, back, shoulders, arms",color:a.blue},{key:"lower",name:"Lower Body",sub:"Friday \xB7 squat, hinge, lunge, calves",color:a.red},{key:"pump",name:"Pump",sub:"Optional \xB7 weekend, arms and delts",color:a.violet,optional:!0},{key:"stretch",name:"Stretch",sub:"Optional \xB7 last, tailored to your week",color:"#5FA8A0",optional:!0}],lt=[1,2,3,4,5],Al="workout-log-v2",ln={hanglegraise:{steps:["Hang from the bar with straight arms and legs, shoulders active.","Keeping your legs straight, raise them until they are at least parallel with the floor.","The key is tilting your pelvis \u2014 curl your hips up at the top rather than just lifting from the hip.","Lower slowly. Once you can do 15 clean reps, hold a light dumbbell between your feet."],avoid:"Swinging. If you're using momentum you've stopped training the abs \u2014 bend the knees slightly and do fewer reps instead."},weightedcrunch:{steps:["Lie on your back with knees bent, feet flat, holding a plate on your chest.","Curl your shoulder blades off the floor by shortening the distance between ribs and hips.","This is a short range \u2014 you're not sitting up, you're crunching. Stop when your lower back starts to lift.","Lower under control. Add weight as soon as you can do 20 clean reps."],avoid:"Pulling on your neck or sitting all the way up, which turns it into a hip-flexor exercise."},hipthrust:{steps:["Sit on the floor with your upper back against the long edge of a bench, just below the shoulder blades.","Roll the Smith bar over your hips \u2014 use a pad or a folded towel, it digs in otherwise.","Feet flat and far enough out that your shins are vertical at the top. Drive through your heels until knee, hip and shoulder form a straight line.","Squeeze hard for a full second at the top, then lower under control without resting the weight on the floor."],avoid:"Arching your lower back to get higher. Keep the ribs down and finish with the glutes \u2014 the top is a straight line, not a backbend."},incline2:{steps:["Set the bench to about 30\xB0 \u2014 one or two notches up.","Start with dumbbells at the sides of your upper chest, elbows about 45\xB0 from your body.","Press up and slightly inward until your arms are straight above your upper chest.","Lower with control. This is the volume-week version \u2014 lighter, 12\u201315 reps, chase the stretch and the pump."],avoid:"Setting the bench past ~45\xB0, where the shoulders take over from the upper chest."},mb_ankle:{steps:["Half-kneel with one foot flat in front, about a hand's width from a wall.","Keeping that heel GLUED down, drive the knee forward over your toes toward the wall.","Go to the point where the heel wants to lift, hold a beat, then rock back.","Shuffle the foot back an inch each set as it gets easier. Both sides."],avoid:"Letting the heel come up or the arch collapse inward \u2014 that's borrowing range instead of building it."},mb_goblet:{steps:["Hold a light dumbbell at your chest and sit into the deepest squat you can control.","Let the weight counterbalance you so you can stay upright.","Put your elbows inside your knees and gently push them out.","Breathe out and sink a little further with each exhale. Stand up between sets."],avoid:"Bouncing at the bottom or holding your breath. This is a loaded hold \u2014 stay still and keep breathing."},mb_9090:{steps:["Sit with one leg bent 90\xB0 in front and the other bent 90\xB0 out to the side.","Keeping your chest tall, lift both knees and rotate them over to the other side.","Control it \u2014 the point is moving under your own power, not falling into position.","That's one rep. Alternate sides."],avoid:"Using your hands to drag your legs across. If you can't move them yourself, sit on a mat to raise your hips."},mb_tspine:{steps:["Sit on the floor with your upper back against the long edge of a bench, hands behind your head.","The bench should hit around the bottom of your shoulder blades.","Keeping your ribs down, extend your upper back over the edge until you feel it open.","Come back up under control. Move the bench contact point up an inch between sets."],avoid:"Arching from the lower back. Ribs stay down \u2014 the movement should happen between the shoulder blades."},mb_wall:{steps:["Stand with your back, backside and head against a wall, feet a few inches out.","Put your forearms flat on the wall with elbows at shoulder height.","Slide your arms up as high as you can while keeping wrists, elbows and lower back in contact.","Slide back down slowly. The contact is the whole exercise."],avoid:"Letting your lower back arch off the wall to get the arms higher \u2014 that's cheating the range you're trying to build."},mb_cat:{steps:["On all fours, hands under shoulders and knees under hips.","Exhale and round your spine one segment at a time, starting from the tailbone.","Inhale and reverse it, arching from the tailbone up to the neck.","Slow \u2014 about four seconds each direction. This is about control, not range."],avoid:"Rushing through it, which turns a mobility drill into a warm-up wiggle."},mb_hang:{steps:["Take an overhand grip on the pull-up bar, hands about shoulder width.","Let your feet come off and hang completely \u2014 arms straight, shoulders relaxed up by your ears.","Breathe and let your bodyweight decompress the shoulders and lats.","Use the assist machine or keep a foot on a box if a full hang is too much."],avoid:"Actively pulling your shoulders down. The point of this one is to let go, not to hold a position."},mb_walk:{steps:["Set the treadmill flat, 3.0\u20133.3 mph, and walk for 15\u201320 minutes.","RPE 3 \u2014 you should be able to hold a full conversation the whole time.","This isn't a cardio session. It's blood flow to everything you just trained.","Skip it if you're short on time; do it if you want to feel better tomorrow."],avoid:"Turning it into a workout. If you're breathing hard, you've missed the point."},st_chest:{steps:["Stand in a doorway with your forearm flat on the frame, elbow at about shoulder height.","Step through with the same-side foot until you feel a stretch across the front of your chest.","Keep your ribs down and your shoulder pulled back \u2014 don't let it roll forward.","Hold and breathe. Do both sides."],avoid:"Pushing into shoulder pain. A stretch is a pull across the chest, not a pinch in the joint."},st_delt:{steps:["Bring one arm straight across your chest at shoulder height.","Hook it with the opposite forearm just above the elbow \u2014 not on the elbow joint.","Draw it toward you until you feel it in the back of the shoulder.","Keep the shoulder down, not shrugged. Hold, then switch."],avoid:"Pulling on the elbow joint itself, which stresses the ligaments rather than stretching the delt."},st_tri:{steps:["Reach one arm overhead and bend the elbow so your hand drops behind your neck.","Use the other hand to gently press the elbow back and down.","You should feel it along the back of the upper arm and into the lat.","Keep your ribs down \u2014 don't arch your lower back to get further."],avoid:"Arching the back to fake extra range. The stretch should come from the shoulder, not the spine."},st_lat:{steps:["Kneel in front of a bench and place both hands on it, arms straight.","Sit your hips back toward your heels and let your chest sink toward the floor.","Push your armpits down. To bias one side, walk both hands a few inches the other way.","Breathe out at the bottom of each hold."],avoid:"Shrugging. Actively push the shoulders away from your ears the whole time."},st_ham:{steps:["Put one heel on a bench with the leg straight, toes pointing up.","Keep a flat back and hinge forward from the hips \u2014 not by rounding your spine.","Stop when you feel a strong pull in the back of the thigh, not the knee.","Hold, then switch legs."],avoid:"Rounding your back to reach further. Flat back and a smaller range beats a rounded spine every time."},st_hip:{steps:["Kneel on one knee with the other foot flat in front, both knees at about 90\xB0.","Squeeze the glute on the kneeling side \u2014 this is what actually creates the stretch.","Shift your hips forward an inch or two. You should feel it at the front of the hip and thigh.","Stay tall, ribs down. Hold, then switch."],avoid:"Leaning forward or arching the lower back, which moves the stretch out of the hip entirely."},st_glute:{steps:["Sit or lie down and cross one ankle over the opposite knee, making a figure 4.","Grab behind the supporting thigh and draw it toward your chest.","You should feel it deep in the glute of the crossed leg.","Keep your head and shoulders relaxed. Hold, then switch."],avoid:"Forcing the crossed knee down with your hand \u2014 let it open on its own."},st_9090:{steps:["Sit with your front leg bent 90\xB0 in front and your back leg bent 90\xB0 out to the side.","Sit tall on both sit bones \u2014 don't collapse to one side.","Lean your chest slowly toward the front shin until you feel the front hip open.","Hold, then switch which leg is in front."],avoid:"Cranking into it. This one is about position, not force \u2014 if your back rounds, sit on a mat or a block."},st_butterfly:{steps:["Sit with the soles of your feet together and heels pulled in toward you.","Hold your ankles and sit up tall through the spine.","Let your knees fall toward the floor under their own weight.","For more, hinge forward from the hips with a flat back."],avoid:"Bouncing your knees. Static means static \u2014 let gravity do it."},st_quad:{steps:["Stand tall, hold something for balance, and grab one ankle behind you.","Pull the heel toward your backside and squeeze that glute.","Keep the knees together and your hips square \u2014 don't let the knee flare out.","Hold, then switch."],avoid:"Yanking the ankle or arching the back. Squeezing the glute is what makes this work."},st_calf:{steps:["Put the ball of one foot on the edge of a step, heel hanging off.","Keep that leg STRAIGHT \u2014 this targets the upper calf.","Let your heel drop below the step until you feel a strong pull.","Hold, then switch. Use a rail for balance."],avoid:"Bouncing at the bottom. A slow steady drop is the whole exercise."},st_soleus:{steps:["Same position as the straight-leg calf stretch, ball of the foot on a step.","Now BEND the knee about 20\xB0, keeping the heel dropped.","The bend shifts the stretch lower, into the soleus underneath the calf.","Hold, then switch."],avoid:"Straightening the knee mid-hold \u2014 that turns it back into the other stretch."},st_child:{steps:["Kneel, sit back onto your heels, and walk your hands forward along the floor.","Let your chest sink toward the ground and rest your forehead down.","Reach the arms long to bring the lats and lower back into it.","Breathe slowly \u2014 long exhales let more range come."],avoid:"Holding tension in the shoulders. This one should feel like doing nothing."},st_twist:{steps:["Sit with both legs out, then cross one foot over the opposite thigh.","Sit tall and place the opposite elbow outside the raised knee.","Rotate your chest toward the raised knee, leading with your sternum.","Keep both sit bones down. Hold, then switch."],avoid:"Twisting from the neck. Turn the ribcage; the head just follows."},st_wrist:{steps:["Straighten one arm in front, palm down and fingers pointing at the floor.","Use the other hand to gently draw the fingers back toward your body.","Then flip: palm up, fingers pointing down, and repeat for the other side of the forearm.","Both directions on both arms."],avoid:"Forcing it. Forearms respond to a light stretch held longer, not a hard one held briefly."},st_trap:{steps:["Sit or stand tall and let one arm hang heavy, or hold the edge of the bench.","Tilt your head to the opposite side, bringing ear toward shoulder.","For a little more, rest the opposite hand on your head \u2014 its weight is enough.","Hold, then switch."],avoid:"Pulling hard on your head. Neck tissue needs far less force than you'd think."},shrug:{steps:["Hold a heavy dumbbell in each hand at your sides, arms straight and relaxed.","Stand tall \u2014 don't lean back or roll your shoulders.","Shrug straight UP toward your ears as high as you can.","Pause a second at the top, then lower slowly to a full stretch."],avoid:"Rolling the shoulders in circles. Straight up and straight down \u2014 rolling grinds the joint under load."},hipabduction:{steps:["Sit in the abductor machine with the pads on the OUTSIDE of your knees.","Sit tall with your back against the pad.","Push your knees apart against the pads as far as they'll go.","Squeeze for a beat, then return slowly \u2014 don't let the stack slam."],avoid:"Leaning back and using momentum. Slow and controlled, or the glute medius does nothing."},backext:{steps:["Set the hip pad just below your hip bones so you can bend freely at the waist.","Cross your arms on your chest, body in a straight line to start.","Lower under control until you feel a stretch in your hamstrings and lower back.","Raise back up until your body is straight \u2014 do NOT arch past straight."],avoid:"Hyperextending at the top. Stopping at a straight line protects the discs; arching back does the opposite."},reversecurl:{steps:["Grab an EZ or straight bar with palms facing DOWN, hands shoulder width.","Elbows pinned to your sides, arms straight, wrists locked flat.","Curl the bar up by bending only at the elbow \u2014 the back of your hand leads.","Lower slowly to full extension. Expect to use far less weight than a normal curl."],avoid:"Letting the wrists bend back under load \u2014 keep them straight or you'll feel it in the joint."},wristcurl:{steps:["Sit on a bench and rest your forearms flat along your thighs, palms up, wrists past your knees.","Hold a light dumbbell or bar and let it roll down to your fingertips.","Curl it back up by closing your hand and flexing the wrist only.","Squeeze at the top, then lower slowly. Forearms stay glued to your thighs the whole time."],avoid:"Moving your elbows or forearms. If anything above the wrist moves, the weight is too heavy."},farmerscarry:{steps:["Pick up a heavy dumbbell in each hand and stand tall \u2014 shoulders back, ribs down.","Walk at a steady pace for the set time or distance.","Grip hard, breathe normally, and don't let your shoulders round forward.","Set the weights down under control rather than dropping them."],avoid:"Leaning to one side or shrugging. If your form breaks, the set is over \u2014 put them down."},machinechest:{steps:["Set the seat so the handles line up with the middle of your chest, not your throat.","Sit back against the pad, feet flat, and grip the handles.","Press forward until your arms are almost straight \u2014 don't snap the elbows.","Let the handles come back slowly until you feel a stretch across your chest."],avoid:"Seat set too high, which turns it into an awkward shoulder press."},onearmrow:{steps:["Put one knee and the same-side hand on a flat bench, other foot on the floor.","Let the dumbbell hang straight down, back flat and roughly parallel to the floor.","Pull the dumbbell to your hip, driving the elbow past your ribs.","Lower all the way to a full stretch. Finish all reps, then switch sides."],avoid:"Twisting your torso to heave the weight up \u2014 shoulders stay square to the floor."},inclinesmith:{steps:["Roll an adjustable bench into the Smith and set it to about 30\xB0.","Position it so the bar lines up over your upper chest, then lie back and unhook.","Lower under control to your upper chest, elbows about 45\xB0 from your body.","Press straight up until your arms lock out."],avoid:"Setting the bench past 45\xB0, where your chest stops doing the work."},cablecurl:{steps:["Set a straight or EZ bar on the low cable and stand a step back from the machine.","Elbows pinned to your sides, arms straight, slight tension already on the cable.","Curl by bending only at the elbow \u2014 the cable keeps tension at the top, unlike dumbbells.","Lower slowly to full extension every rep."],avoid:"Standing too close, which kills the tension at the bottom of the rep."},benchdip:{steps:["Sit on a bench, hands beside your hips, and slide your backside off the edge.","Walk your feet out \u2014 further out is harder, tucked in is easier.","Lower by bending your elbows straight back until your upper arms are about parallel to the floor.","Press back up to a lockout without shrugging your shoulders up."],avoid:"Dropping too deep and letting your shoulders roll forward, which strains the joint."},dbfly:{steps:["Lie on a flat bench with a light dumbbell in each hand, arms straight above your chest.","Set a slight bend in your elbows and keep that exact bend the whole rep.","Open your arms out in a wide arc until you feel a stretch across your chest.","Bring them back together above your chest and squeeze."],avoid:"Going heavy. Flies are a stretch exercise \u2014 if you're bending your elbows to move it, go lighter."},goblet:{steps:["Hold one dumbbell vertically against your chest, cupping the top end with both hands.","Feet shoulder width, toes turned slightly out, chest tall.","Sit straight down between your knees until your thighs pass parallel.","Drive up through your whole foot, keeping the dumbbell tight to your chest."],avoid:"Letting the weight pull you forward \u2014 the dumbbell stays against your chest, not out in front."},lyinglegraise:{steps:["Lie flat on a mat with your hands tucked under your hips for support.","Press your lower back into the floor and keep it there.","Raise your legs until they're vertical, curling your hips slightly off the floor at the top.","Lower slowly, stopping before your heels touch."],avoid:"Letting your lower back arch off the mat \u2014 bend the knees to shorten the lever if it does."},sideplankknees:{steps:["Lie on your side with your elbow under your shoulder and your knees bent behind you.","Drive your hips up so your body makes a straight line from knees to shoulders.","Hold, breathing normally.","Lower under control and repeat on the other side."],avoid:"Letting the hips sag \u2014 cut the hold short instead of holding a broken position."},suitcase:{steps:["Pick up one heavy dumbbell and hold it at your side like a suitcase.","Stand tall \u2014 shoulders level, ribs down. Do not lean away from the weight.","Walk slowly and evenly for the set distance or time.","Set it down, switch hands, repeat. Both sides is one set."],avoid:"Leaning to the opposite side. Your obliques resisting that lean is the whole exercise."},plankbench:{steps:["Put your forearms on a flat bench, elbows under your shoulders, feet back on the floor.","Squeeze your glutes and tuck your ribs down to flatten your lower back.","Hold a straight line from heels to head.","The higher the bench, the easier \u2014 drop to the floor as you get stronger."],avoid:"Letting the hips sag. Raise the surface instead of holding a broken position."},birddog:{steps:["On all fours, hands under shoulders, knees under hips, back flat.","Brace your core so your spine doesn't move.","Extend one arm forward and the opposite leg back until both are level with your torso.","Return slowly and switch sides. Left plus right is one rep."],avoid:"Letting your hips rotate open as the leg goes back \u2014 the point is that nothing moves but the limbs."},dblegcurl:{steps:["Lie face down on a bench and have a partner or the rack hand you a dumbbell.","Grip it between your feet, squeezing so it can't slip.","Curl your heels toward your glutes as far as you can.","Lower slowly. Go light \u2014 the grip is usually the limit, not the hamstrings."],avoid:"Doing this without a secure grip on the dumbbell. If it feels unstable, use a machine instead."},legpresshigh:{steps:["Same setup as a normal leg press, but place your feet high on the platform.","The higher your feet, the more the work shifts to glutes and hamstrings.","Lower under control until your knees reach about 90\xB0, hips staying flat on the pad.","Press through your heels rather than the balls of your feet."],avoid:"Going so high that your heels hang off the platform edge."},smithohp:{steps:["Slide an upright bench under the Smith rails so the bar sits just in front of your face.","Sit tall with your back on the pad, grip just outside shoulder width, and unhook.","Press straight up until your arms lock out overhead.","Lower under control to chin height, then press again. The rails hold the path for you."],avoid:"Setting the bench too far back so the bar drags across your face on the way down."},assistpull:{steps:["Set the assist weight \u2014 more assist makes it easier, so start high and work down.","Grip the bar slightly wider than shoulders, knees on the pad.","Pull until your chin clears the bar, driving your elbows down and back.","Lower slowly to a full hang before the next rep."],avoid:"Chasing reps with heavy assist. Fewer reps with less assist is the actual progress."},cablefly:{steps:["Set both cables high, grab a handle in each hand, and step forward into a stagger.","Start with arms wide and a slight bend in the elbows \u2014 keep that bend fixed all rep.","Sweep your hands down and together in front of your hips, squeezing your chest.","Open slowly back to the stretch without letting the weight yank your shoulders."],avoid:"Bending and straightening the elbows \u2014 that turns a fly into a press."},hammercurl:{steps:["Stand with dumbbells at your sides, palms facing inward toward your body.","Keep that neutral grip the whole rep \u2014 thumbs stay on top.","Curl up by bending only at the elbow, upper arms still.","Lower slowly to a full hang."],avoid:"Rotating the palms up as you curl \u2014 that makes it a regular curl and skips the forearm."},revpecdeck:{steps:["Sit facing the pec deck backrest, chest against the pad, and grab the handles in front of you.","Start with arms nearly straight and a small elbow bend.","Sweep your arms out and back in a wide arc, squeezing your shoulder blades together.","Return slowly under control. This is rear delts \u2014 go lighter than you think."],avoid:"Shrugging or using your whole torso to swing the handles back."},hacksquat:{steps:["Shoulders under the pads, back flat against the backrest, feet shoulder width on the platform.","Release the safeties and lower under control until your thighs pass parallel.","Keep your hips pressed into the pad the whole way down.","Drive up through your whole foot without slamming into lockout."],avoid:"Letting your hips round off the back pad at the bottom \u2014 that's where the lower back gets hurt."},bulgarian:{steps:["Stand a stride in front of a bench and place the top of one foot behind you on it.","Hold dumbbells at your sides and set your front foot far enough forward that your shin stays vertical.","Lower straight down until your back knee is near the floor.","Drive up through the front foot. Finish all reps on one leg, then switch."],avoid:"Setting the front foot too close, which shoves your knee way past your toes."},seatedcalf:{steps:["Sit with the balls of your feet on the platform and the thigh pad locked snug over your knees.","Release the safety and let your heels drop below the platform for a deep stretch.","Pause a beat in the stretch, then press up onto your toes as high as you can.","Pause at the top too, then lower slowly. The bent knee shifts work to the soleus."],avoid:"Bouncing quickly through a short range \u2014 the pauses at both ends are the exercise."},pullthrough:{steps:["Set a rope on the low cable, face away, and pass the rope between your legs from behind.","Step forward until there's tension, feet shoulder width, slight knee bend.","Push your hips straight back, letting the rope travel back between your legs, back flat.","Drive your hips forward to stand tall and squeeze your glutes hard at the top."],avoid:"Turning it into a squat. The knees barely move \u2014 this is all hips."},dbohp2:{steps:["Set the bench upright. Sit with your back fully against the pad, feet flat.","Start with dumbbells at shoulder height, palms forward.","Press straight up until your arms lock out overhead.","Lower to ear level. Lighter weight and higher reps than the heavy weeks."],avoid:"Arching off the pad to press more weight."},pulldown2:{steps:["Grip the bar slightly wider than shoulders, thighs locked under the pads.","Sit tall with a few degrees of lean-back.","Pull the bar to your collarbone, leading with your elbows.","Control it all the way up. Lighter this week \u2014 hold the squeeze at the bottom for a beat."],avoid:"Rocking backward to yank the weight down."},calfraise2:{steps:["Balls of your feet on the edge of the block, heels hanging off.","Lower your heels below the edge until you feel a deep stretch, pause a second.","Rise onto your tiptoes as high as you can.","Pause at the top, lower slowly. Lighter and higher reps than the heavy weeks."],avoid:"Bouncing out of the bottom."},cablecrunch2:{steps:["Kneel facing the machine with a rope set at the top, hands beside your ears.","Hinge slightly so there's tension on the cable before you start.","Crunch down by curling your ribs toward your hips \u2014 round your upper back deliberately.","Lighter weight and higher reps this week. Hips stay in the same spot throughout."],avoid:"Rocking at the hips like a bow \u2014 if your hips move, it's a hip flexor exercise."},plank:{steps:["Forearms on the floor, elbows directly under your shoulders, feet hip width.","Squeeze your glutes hard and tuck your ribs down toward your hips \u2014 that flattens your lower back.","Hold a straight line from heels to head. Breathe normally.","Stop the set the moment your hips start to sag or hike up, even if the timer hasn't finished."],avoid:"Holding a sagging plank to beat a time. A tight 30 seconds beats a sloppy 90."},sideplank:{steps:["Lie on one side, elbow under your shoulder, feet stacked or staggered.","Drive your hips up until your body makes a straight line from ankle to shoulder.","Reach your top arm to the ceiling and keep your neck neutral.","Hold, then repeat on the other side. Both sides count as one set."],avoid:"Letting the hips drift backward or sink \u2014 you should feel it in the side of your waist, not your shoulder."},captainschair:{steps:["Set your forearms on the pads and press your back flat against the backrest.","Hang with your legs straight and completely still.","Raise your knees up past your hips, curling your pelvis toward your ribs at the top.","Lower slowly until your legs are straight again before the next rep."],avoid:"Swinging your legs up with momentum, or arching your back off the pad."},machinecrunch:{steps:["Set the seat so the pads sit against your chest or shoulders and your knees are hooked.","Grip the handles and start upright with light tension already on the stack.","Crunch by shortening the distance from your ribs to your hips \u2014 round your back deliberately.","Return slowly, resisting the weight the whole way up."],avoid:"Pulling with your arms or bending at the hips \u2014 the movement is a spinal curl, not a hinge."},deadbug:{steps:["Lie on your back, knees bent at 90\xB0 over your hips, arms straight up toward the ceiling.","Press your lower back flat into the floor and hold it there for every rep.","Slowly extend one arm overhead and the opposite leg out straight, stopping just before they touch the floor.","Return to the start and switch sides. Left plus right is one rep."],avoid:"Letting your lower back arch off the floor as you extend \u2014 shorten the range until it stays flat."},smithbench:{steps:["Roll a flat bench into the Smith so the bar lines up over your mid-chest. Lie back, feet flat, shoulder blades pinned.","Grip slightly wider than shoulder width. Twist the bar to unhook it.","Lower under control (~2 sec) to your mid-chest with elbows about 45\xB0 from your body.","Press straight up until your arms lock. The rails handle the path \u2014 you just control the speed."],avoid:"Setting the bench too far forward so the bar lands on your throat. Check the bar's landing spot before you unhook."},cablerow:{steps:["Sit with feet braced, knees slightly bent, and grab the handle.","Sit tall with your chest up and arms fully extended \u2014 you should feel a stretch across your upper back.","Pull the handle to your belly button, driving elbows back and squeezing your shoulder blades together.","Return slowly to the full stretch without letting your torso get pulled forward."],avoid:"Rocking back and forth with your torso \u2014 your back angle should barely change."},dbohp:{steps:["Set the bench upright. Sit with your back fully against the pad, feet flat.","Start with dumbbells at shoulder height, palms forward, elbows under your wrists.","Press straight up until your arms lock out overhead.","Lower under control until the weights reach about ear level."],avoid:"Arching off the pad to press more weight \u2014 that turns it into a bad incline press."},pulldown:{steps:["Grip the bar slightly wider than shoulders, palms forward. Lock your thighs under the pads.","Lean back just a few degrees and lift your chest.","Pull the bar to your collarbone, leading with your elbows.","Control the bar all the way up until your arms are fully stretched."],avoid:"Rocking backward to yank the weight down, or pulling the bar behind your neck."},incline:{steps:["Set the bench to about 30\xB0 \u2014 one or two notches up, not halfway to vertical.","Start with dumbbells at the sides of your upper chest, elbows ~45\xB0 from your body.","Press up and slightly inward until your arms are straight above your upper chest.","Lower with control (~2 sec) until you feel a stretch across your chest."],avoid:"Setting the bench past ~45\xB0 \u2014 it becomes a shoulder press and your chest stops working."},dbcurl:{steps:["Stand tall, dumbbells at your sides, palms forward, elbows pinned to your ribs.","Curl the weights up by bending only at the elbow \u2014 upper arms stay still.","Squeeze hard for a beat at the top.","Lower slowly (~2 sec) to a full hang."],avoid:"Swinging your hips or leaning back to start the rep \u2014 go lighter and stricter."},pushdown:{steps:["Face the cable with the rope at the top. Elbows bent past 90\xB0 and pinned to your sides.","Push down until your arms are fully straight, splitting the rope apart at the bottom.","Hold the lockout for a beat \u2014 that's peak triceps tension.","Let the rope rise under control without your elbows drifting forward."],avoid:"Letting your elbows float forward or leaning your bodyweight onto the cable."},facepull:{steps:["Set the cable at face height with the rope. Grab the ends with thumbs pointing back at you.","Step back until your arms are straight and there's tension.","Pull toward your eyebrows, elbows high and wide, knuckles rotating toward the ceiling.","Pause with your upper back squeezed, then return slowly."],avoid:"Elbows dropping and turning it into a row \u2014 the elbows-high path is the whole point."},dbbench:{steps:["Sit on a flat bench with the dumbbells on your thighs, then kick them up as you lie back.","Start with arms straight above your chest, palms forward.","Lower until the dumbbells are level with your chest \u2014 go deeper than a bar allows.","Press up and slightly together until your arms lock out."],avoid:"Clanging the dumbbells together at the top and losing tension on your chest."},machrow:{steps:["Set the chest pad so your arms can fully extend without your chest lifting off it.","Grab the handles with arms straight, chest pressed into the pad.","Pull the handles back, driving your elbows past your ribs and squeezing your shoulder blades.","Return all the way to a full stretch, keeping your chest on the pad the whole time."],avoid:"Peeling your chest off the pad to pull heavier \u2014 the pad is what makes this strict."},machpress:{steps:["Adjust the seat so the handles sit at about shoulder height.","Sit with your back flat on the pad and grab the handles.","Press up until your arms are almost locked \u2014 don't slam the joint.","Lower slowly until your hands are back at shoulder level."],avoid:"Setting the seat too low, which forces your shoulders into an awkward overhead angle."},neutralpull:{steps:["Attach the close/neutral grip handle. Lock your thighs under the pads.","Sit tall, arms fully extended overhead.","Pull the handle to your upper chest, elbows driving down and back.","Return under control to a full overhead stretch."],avoid:"Using the same grip and path as the wide pulldown \u2014 this one should feel lower on your lats."},pecdeck:{steps:["Set the seat so the handles are at chest height and your feet are flat.","Grab the handles with a slight bend in your elbows \u2014 keep that bend fixed all rep.","Bring the handles together in front of your chest and squeeze for a beat.","Open slowly until you feel a stretch across your chest, but don't let the weight yank your shoulders back."],avoid:"Bending and straightening your elbows \u2014 that turns a fly into a press."},ezcurl:{steps:["Grab the EZ bar at the angled sections, palms up, elbows at your sides.","Stand tall with a slight knee bend, arms fully straight.","Curl the bar up by bending at the elbows only.","Lower slowly to full extension every rep."],avoid:"Letting your elbows drift forward at the top \u2014 that gives your shoulders the work."},ohext:{steps:["Set the cable low with a rope. Face away, rope pulled up behind your head.","Step forward into a staggered stance, elbows pointing up and forward beside your ears.","Extend your arms overhead until straight, spreading the rope.","Lower slowly behind your head for a deep triceps stretch."],avoid:"Letting your elbows flare wide \u2014 keep them narrow so the triceps do the work."},lateral:{steps:["Stand with light dumbbells at your sides, slight bend in the elbows.","Raise the weights out to your sides, leading with your elbows, not your hands.","Stop when your arms reach shoulder height \u2014 no higher.","Lower slowly, taking about 3 seconds down."],avoid:"Going too heavy and swinging \u2014 this is the one lift where ego costs you the most."},smithsquat:{steps:["Set the bar on your upper traps and position your feet slightly in FRONT of the bar (the rails let you do this safely).","Unhook, take a big breath, and brace your core.","Sit down and back until your thighs reach at least parallel.","Drive up through your whole foot, knees tracking over your toes."],avoid:"Standing with feet directly under the bar \u2014 it forces your knees forward and strains them."},smithrdl:{steps:["Set the bar at hip height, grip just outside your thighs, feet hip width, knees slightly bent.","Unhook and stand tall.","Push your hips straight back, letting the bar slide down your thighs, back flat.","Lower to mid-shin where you feel the hamstring stretch, then drive your hips forward to stand."],avoid:"Bending your knees more as you lower \u2014 that's a squat. The knee angle stays fixed."},legpress:{steps:["Sit with your back and hips flat against the pad, feet shoulder width at mid-platform.","Release the safeties and lower until your knees reach about 90\xB0 or slightly deeper.","Stop before your hips curl off the pad.","Press through your whole foot until your legs are nearly straight \u2014 don't slam lockout."],avoid:"Loading it up for tiny half reps \u2014 depth builds legs, plate count doesn't."},legpressheavy:{steps:["Same setup, but place your feet LOWER on the platform to bias your quads.","Lower under control until your knees reach about 90\xB0.","Because the load is heavier here, keep the range slightly shorter and strict.","Press up through the balls and heels evenly."],avoid:"Letting your knees cave inward under the heavier load \u2014 push them out as you press."},dbrdl:{steps:["Hold a dumbbell in each hand in front of your thighs, feet hip width, knees slightly bent.","Push your hips back and lower the dumbbells along the front of your legs.","Go until you feel a strong hamstring stretch \u2014 dumbbells let you go deeper than the Smith.","Squeeze your glutes to stand tall without leaning back."],avoid:"Letting the dumbbells drift away from your legs \u2014 that loads your lower back instead."},legext:{steps:["Set the back pad so your knee lines up with the machine's pivot point.","Hook your shins behind the roller, hands on the handles.","Straighten your legs fully and pause one second at the top.","Lower slowly \u2014 about 3 seconds \u2014 without letting the stack touch down."],avoid:"Kicking the weight up with a jerk \u2014 the top pause is where the quad work happens."},smithlunge:{steps:["Set the bar on your upper traps and unhook, standing under the rails.","Step one foot straight back and drop that knee toward the floor.","Front shin vertical, torso upright, weight through the front heel.","Push through the front foot to return, then repeat on the same leg or alternate."],avoid:"Stepping back too short, which drives your front knee way past your toes."},seatedcurl:{steps:["Adjust the pad so it sits just above your heels, knee aligned with the pivot.","Lock the thigh pad down so your legs can't lift.","Curl your heels toward your glutes as far as the machine allows.","Squeeze one second, then lower over about 3 seconds."],avoid:"Hips lifting off the seat \u2014 that's your back cheating the hamstrings."},lyingcurl:{steps:["Lie face down with the pad just above your heels and your knees just off th
