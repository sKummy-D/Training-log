<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Training Log</title>
<meta name="description" content="A 3-day training log built for Planet Fitness equipment." />

<!-- installs to the home screen and opens without browser chrome -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Training Log" />
<meta name="theme-color" content="#17181B" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; background: #17181B; }
  body {
    font-family: 'Barlow', system-ui, -apple-system, sans-serif;
    color: #ECEAE4;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #root { min-height: 100vh; }
  #boot { display: grid; place-items: center; min-height: 100vh; color: #6E7178; font-size: 14px; }
</style>
</head>
<body>
<div id="root"><div id="boot">Loading your log…</div></div>

 Calf Raise",cue:"Bent knee variation",F:Bp}]}],oo={A:{name:"HEAVY",rir:"Stop 2\u20133 reps short of failure",blurb:"Lower reps, heavier loads, longer rest. Chase weight on the bar."},B:{name:"VOLUME",rir:"Stop 1\u20132 reps short \u2014 last set of isolation work can go to failure",blurb:"Higher reps, shorter rest, more time under tension. Chase reps."}},Wg={"upper-A":[{id:"hlr",name:"Hanging Knee Raise",target:"3 \xD7 max",sets:3,rest:"60 sec",bw:!0,cue:"Curl pelvis up, kill the swing",F:Sp,alts:[{name:"Captain's Chair Knee Raise",cue:"Forearms on pads, back supported",F:xp},{name:"Lying Leg Raise",cue:"On a mat, hands under hips",F:ro}]},{id:"plank",name:"Plank",target:"3 \xD7 45 sec",sets:3,rest:"45 sec",bw:!0,unit:"sec",cue:"Squeeze glutes, ribs down, don't sag",F:va,alts:[{name:"Forearm Plank on Bench",cue:"Elbows on a bench \u2014 easier",F:va},{name:"Dead Bug",cue:"Opposite arm and leg, slow",F:ro}]}],"lower-A":[{id:"cablecrunch",name:"Cable Crunch",target:"3 \xD7 15",sets:3,rest:"60 sec",cue:"Curl your ribs to your hips",F:ma,alts:[{name:"Machine Crunch",cue:"Seated ab machine",F:Jn},{name:"Weighted Crunch",cue:"Plate on your chest",F:Jn}]},{id:"sideplank",name:"Side Plank",target:"3 \xD7 30 sec / side",sets:3,rest:"45 sec",bw:!0,unit:"sec",cue:"Stack the hips, drive them up",F:wa,alts:[{name:"Side Plank from Knees",cue:"Bottom knee down \u2014 easier",F:wa},{name:"Suitcase Carry",cue:"One heavy dumbbell, walk tall",F:wa}]}],"upper-B":[{id:"captainschair",name:"Captain's Chair Knee Raise",target:"3 \xD7 max",sets:3,rest:"60 sec",bw:!0,cue:"Back flat on the pad, no swinging",F:xp,alts:[{name:"Hanging Knee Raise",cue:"From the bar instead",F:Sp},{name:"Lying Leg Raise",cue:"On a mat",F:ro}]},{id:"machinecrunch",name:"Machine Crunch",target:"3 \xD7 15\u201320",sets:3,rest:"45 sec",cue:"Shorten the distance ribs to hips",F:Jn,alts:[{name:"Cable Crunch",cue:"Kneeling, rope at the top",F:ma},{name:"Weighted Crunch",cue:"Plate on your chest",F:Jn}]}],"lower-B":[{id:"cablecrunch2",name:"Cable Crunch",target:"3 \xD7 20",sets:3,rest:"45 sec",cue:"Lighter, higher reps this week",F:ma,alts:[{name:"Machine Crunch",cue:"Seated ab machine",F:Jn},{name:"Weighted Crunch",cue:"Plate on your chest",F:Jn}]},{id:"deadbug",name:"Dead Bug",target:"3 \xD7 10 / side",sets:3,rest:"45 sec",bw:!0,cue:"Low back pinned flat, move slow",F:ro,alts:[{name:"Bird Dog",cue:"On all fours, opposite limbs",F:ro},{name:"Plank",cue:"Hold instead of moving",F:va}]}]},so=(e,t)=>Wg[`${e}-${Vl(t)}`]||[],Vl=e=>e%2===1?"A":"B",Ql=(e,t)=>{let n=Vl(t);return e==="upper"?n==="A"?Pa:Fa:e==="lower"?n==="A"?Ta:_a:[]},Og=[...Pa,...Fa,...Ta,..._a],ka={A:{label:"Speed Intervals",mins:"~50 min",steps:["Warm-up \u2014 8 min \xB7 3.5 mph \xB7 1%","HARD \u2014 2 min \xB7 5.5\u20136.5 mph \xB7 1%","EASY \u2014 3 min \xB7 3.2 mph \xB7 1%","Repeat HARD / EASY \xD7 7 (35 min)","Cool-down \u2014 7 min \xB7 3.0 mph \xB7 0%"],progress:"When the last hard rep still feels like a 7/10, add 0.2 mph to the run speed."},B:{label:"Incline Steady Walk",mins:"~50 min",steps:["Warm-up \u2014 6 min \xB7 3.0 mph \xB7 0%","Steady \u2014 38 min \xB7 3.0\u20133.3 mph \xB7 10\u201312%","Hold a 5\u20136/10 effort throughout","Can't hold the speed? Drop incline 2%","Cool-down \u2014 6 min \xB7 2.5 mph \xB7 0%"],progress:"Add 1% incline before you add speed \u2014 incline is what makes this one work."},C:{label:"Endurance Run / Walk",mins:"~50 min \xB7 3.0 mi",steps:["Warm-up \u2014 5 min walk \xB7 3.5 mph \xB7 1%","RUN 0.5 mi \xB7 5.5\u20136.5 mph \xB7 1%","WALK 0.5 mi \xB7 3.5 mph \xB7 2%","Repeat RUN / WALK \xD7 3 \u2192 3.0 mi total","Cool-down \u2014 5 min walk \xB7 3.0 mph \xB7 0%"],progress:"Step 1: all three run halves unbroken. Step 2: go 0.75 mi run / 0.25 mi walk. Step 3: a continuous mile, then build from there."}},jl=[{key:"upper",name:"Upper Body",sub:"Chest \xB7 Back \xB7 Shoulders \xB7 Arms",color:u.blue},{key:"lower",name:"Lower Body",sub:"Squat \xB7 Hinge \xB7 Lunge \xB7 Calves",color:u.red},{key:"cardio",name:"Cardio",sub:"Treadmill \xB7 pick one option",color:u.yellow}],io=[1,2,3,4,5],Nl="workout-log-v2",er={smithohp:{steps:["Slide an upright bench under the Smith rails so the bar sits just in front of your face.","Sit tall with your back on the pad, grip just outside shoulder width, and unhook.","Press straight up until your arms lock out overhead.","Lower under control to chin height, then press again. The rails hold the path for you."],avoid:"Setting the bench too far back so the bar drags across your face on the way down."},assistpull:{steps:["Set the assist weight \u2014 more assist makes it easier, so start high and work down.","Grip the bar slightly wider than shoulders, knees on the pad.","Pull until your chin clears the bar, driving your elbows down and back.","Lower slowly to a full hang before the next rep."],avoid:"Chasing reps with heavy assist. Fewer reps with less assist is the actual progress."},cablefly:{steps:["Set both cables high, grab a handle in each hand, and step forward into a stagger.","Start with arms wide and a slight bend in the elbows \u2014 keep that bend fixed all rep.","Sweep your hands down and together in front of your hips, squeezing your chest.","Open slowly back to the stretch without letting the weight yank your shoulders."],avoid:"Bending and straightening the elbows \u2014 that turns a fly into a press."},hammercurl:{steps:["Stand with dumbbells at your sides, palms facing inward toward your body.","Keep that neutral grip the whole rep \u2014 thumbs stay on top.","Curl up by bending only at the elbow, upper arms still.","Lower slowly to a full hang."],avoid:"Rotating the palms up as you curl \u2014 that makes it a regular curl and skips the forearm."},revpecdeck:{steps:["Sit facing the pec deck backrest, chest against the pad, and grab the handles in front of you.","Start with arms nearly straight and a small elbow bend.","Sweep your arms out and back in a wide arc, squeezing your shoulder blades together.","Return slowly under control. This is rear delts \u2014 go lighter than you think."],avoid:"Shrugging or using your whole torso to swing the handles back."},hacksquat:{steps:["Shoulders under the pads, back flat against the backrest, feet shoulder width on the platform.","Release the safeties and lower under control until your thighs pass parallel.","Keep your hips pressed into the pad the whole way down.","Drive up through your whole foot without slamming into lockout."],avoid:"Letting your hips round off the back pad at the bottom \u2014 that's where the lower back gets hurt."},bulgarian:{steps:["Stand a stride in front of a bench and place the top of one foot behind you on it.","Hold dumbbells at your sides and set your front foot far enough forward that your shin stays vertical.","Lower straight down until your back knee is near the floor.","Drive up through the front foot. Finish all reps on one leg, then switch."],avoid:"Setting the front foot too close, which shoves your knee way past your toes."},seatedcalf:{steps:["Sit with the balls of your feet on the platform and the thigh pad locked snug over your knees.","Release the safety and let your heels drop below the platform for a deep stretch.","Pause a beat in the stretch, then press up onto your toes as high as you can.","Pause at the top too, then lower slowly. The bent knee shifts work to the soleus."],avoid:"Bouncing quickly through a short range \u2014 the pauses at both ends are the exercise."},pullthrough:{steps:["Set a rope on the low cable, face away, and pass the rope between your legs from behind.","Step forward until there's tension, feet shoulder width, slight knee bend.","Push your hips straight back, letting the rope travel back between your legs, back flat.","Drive your hips forward to stand tall and squeeze your glutes hard at the top."],avoid:"Turning it into a squat. The knees barely move \u2014 this is all hips."},dbohp2:{steps:["Set the bench upright. Sit with your back fully against the pad, feet flat.","Start with dumbbells at shoulder height, palms forward.","Press straight up until your arms lock out overhead.","Lower to ear level. Lighter weight and higher reps than the heavy weeks."],avoid:"Arching off the pad to press more weight."},pulldown2:{steps:["Grip the bar slightly wider than shoulders, thighs locked under the pads.","Sit tall with a few degrees of lean-back.","Pull the bar to your collarbone, leading with your elbows.","Control it all the way up. Lighter this week \u2014 hold the squeeze at the bottom for a beat."],avoid:"Rocking backward to yank the weight down."},calfraise2:{steps:["Balls of your feet on the edge of the block, heels hanging off.","Lower your heels below the edge until you feel a deep stretch, pause a second.","Rise onto your tiptoes as high as you can.","Pause at the top, lower slowly. Lighter and higher reps than the heavy weeks."],avoid:"Bouncing out of the bottom."},cablecrunch2:{steps:["Kneel facing the machine with a rope set at the top, hands beside your ears.","Hinge slightly so there's tension on the cable before you start.","Crunch down by curling your ribs toward your hips \u2014 round your upper back deliberately.","Lighter weight and higher reps this week. Hips stay in the same spot throughout."],avoid:"Rocking at the hips like a bow \u2014 if your hips move, it's a hip flexor exercise."},plank:{steps:["Forearms on the floor, elbows directly under your shoulders, feet hip width.","Squeeze your glutes hard and tuck your ribs down toward your hips \u2014 that flattens your lower back.","Hold a straight line from heels to head. Breathe normally.","Stop the set the moment your hips start to sag or hike up, even if the timer hasn't finished."],avoid:"Holding a sagging plank to beat a time. A tight 30 seconds beats a sloppy 90."},sideplank:{steps:["Lie on one side, elbow under your shoulder, feet stacked or staggered.","Drive your hips up until your body makes a straight line from ankle to shoulder.","Reach your top arm to the ceiling and keep your neck neutral.","Hold, then repeat on the other side. Both sides count as one set."],avoid:"Letting the hips drift backward or sink \u2014 you should feel it in the side of your waist, not your shoulder."},captainschair:{steps:["Set your forearms on the pads and press your back flat against the backrest.","Hang with your legs straight and completely still.","Raise your knees up past your hips, curling your pelvis toward your ribs at the top.","Lower slowly until your legs are straight again before the next rep."],avoid:"Swinging your legs up with momentum, or arching your back off the pad."},machinecrunch:{steps:["Set the seat so the pads sit against your chest or shoulders and your knees are hooked.","Grip the handles and start upright with light tension already on the stack.","Crunch by shortening the distance from your ribs to your hips \u2014 round your back deliberately.","Return slowly, resisting the weight the whole way up."],avoid:"Pulling with your arms or bending at the hips \u2014 the movement is a spinal curl, not a hinge."},deadbug:{steps:["Lie on your back, knees bent at 90\xB0 over your hips, arms straight up toward the ceiling.","Press your lower back flat into the floor and hold it there for every rep.","Slowly extend one arm overhead and the opposite leg out straight, stopping just before they touch the floor.","Return to the start and switch sides. Left plus right is one rep."],avoid:"Letting your lower back arch off the floor as you extend \u2014 shorten the range until it stays flat."},smithbench:{steps:["Roll a flat bench into the Smith so the bar lines up over your mid-chest. Lie back, feet flat, shoulder blades pinned.","Grip slightly wider than shoulder width. Twist the bar to unhook it.","Lower under control (~2 sec) to your mid-chest with elbows about 45\xB0 from your body.","Press straight up until your arms lock. The rails handle the path \u2014 you just control the speed."],avoid:"Setting the bench too far forward so the bar lands on your throat. Check the bar's landing spot before you unhook."},cablerow:{steps:["Sit with feet braced, knees slightly bent, and grab the handle.","Sit tall with your chest up and arms fully extended \u2014 you should feel a stretch across your upper back.","Pull the handle to your belly button, driving elbows back and squeezing your shoulder blades together.","Return slowly to the full stretch without letting your torso get pulled forward."],avoid:"Rocking back and forth with your torso \u2014 your back angle should barely change."},dbohp:{steps:["Set the bench upright. Sit with your back fully against the pad, feet flat.","Start with dumbbells at shoulder height, palms forward, elbows under your wrists.","Press straight up until your arms lock out overhead.","Lower under control until the weights reach about ear level."],avoid:"Arching off the pad to press more weight \u2014 that turns it into a bad incline press."},pulldown:{steps:["Grip the bar slightly wider than shoulders, palms forward. Lock your thighs under the pads.","Lean back just a few degrees and lift your chest.","Pull the bar to your collarbone, leading with your elbows.","Control the bar all the way up until your arms are fully stretched."],avoid:"Rocking backward to yank the weight down, or pulling the bar behind your neck."},incline:{steps:["Set the bench to about 30\xB0 \u2014 one or two notches up, not halfway to vertical.","Start with dumbbells at the sides of your upper chest, elbows ~45\xB0 from your body.","Press up and slightly inward until your arms are straight above your upper chest.","Lower with control (~2 sec) until you feel a stretch across your chest."],avoid:"Setting the bench past ~45\xB0 \u2014 it becomes a shoulder press and your chest stops working."},dbcurl:{steps:["Stand tall, dumbbells at your sides, palms forward, elbows pinned to your ribs.","Curl the weights up by bending only at the elbow \u2014 upper arms stay still.","Squeeze hard for a beat at the top.","Lower slowly (~2 sec) to a full hang."],avoid:"Swinging your hips or leaning back to start the rep \u2014 go lighter and stricter."},pushdown:{steps:["Face the cable with the rope at the top. Elbows bent past 90\xB0 and pinned to your sides.","Push down until your arms are fully straight, splitting the rope apart at the bottom.","Hold the lockout for a beat \u2014 that's peak triceps tension.","Let the rope rise under control without your elbows drifting forward."],avoid:"Letting your elbows float forward or leaning your bodyweight onto the cable."},facepull:{steps:["Set the cable at face height with the rope. Grab the ends with thumbs pointing back at you.","Step back until your arms are straight and there's tension.","Pull toward your eyebrows, elbows high and wide, knuckles rotating toward the ceiling.","Pause with your upper back squeezed, then return slowly."],avoid:"Elbows dropping and turning it into a row \u2014 the elbows-high path is the whole point."},dbbench:{steps:["Sit on a flat bench with the dumbbells on your thighs, then kick them up as you lie back.","Start with arms straight above your chest, palms forward.","Lower until the dumbbells are level with your chest \u2014 go deeper than a bar allows.","Press up and slightly together until your arms lock out."],avoid:"Clanging the dumbbells together at the top and losing tension on your chest."},machrow:{steps:["Set the chest pad so your arms can fully extend without your chest lifting off it.","Grab the handles with arms straight, chest pressed into the pad.","Pull the handles back, driving your elbows past your ribs and squeezing your shoulder blades.","Return all the way to a full stretch, keeping your chest on the pad the whole time."],avoid:"Peeling your chest off the pad to pull heavier \u2014 the pad is what makes this strict."},machpress:{steps:["Adjust the seat so the handles sit at about shoulder height.","Sit with your back flat on the pad and grab the handles.","
