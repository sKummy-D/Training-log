<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Training Log</title>
<meta name="description" content="A 3-day training log built for Planet Fitness equipment." />

<!-- installs to the home screen and opens without browser chrome -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  html, body { margin: 0; padding: 0; background: #17181B; }

    font-family: 'Barlow', system-ui, -apple-system, sans-serif;
    color: #ECEAE4;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #root { min-height: 100vh; }
  #boot { display: grid; place-items: center; min-height: 100vh; color: #6E7178; font-size: 14px; }
</style>
</head>

e."}},yo=[{key:"upper",name:"Upper Body",sub:"Chest \xB7 Back \xB7 Shoulders \xB7 Arms",color:c.blue},{key:"lower",name:"Lower Body",sub:"Squat \xB7 Hinge \xB7 Lunge \xB7 Calves",color:c.red},{key:"cardio",name:"Cardio",sub:"Treadmill \xB7 pick one option",color:c.yellow}],Ir=[1,2,3,4,5],fo="workout-log-v2",Us={smithbench:{steps:["Roll a flat bench into the Smith so the bar lines up over your mid-chest. Lie back, feet flat, shoulder blades pinned.","Grip slightly wider than shoulder width. Twist the bar to unhook it.","Lower under control (~2 sec) to your mid-chest with elbows about 45\xB0 from your body.","Press straight up until your arms lock. The rails handle the path \u2014 you just control the speed."],avoid:"Setting the bench too far forward so the bar lands on your throat. Check the bar's landing spot before you unhook."},cablerow:{steps:["Sit with feet braced, knees slightly bent, and grab the handle.","Sit tall with your chest up and arms fully extended \u2014 you should feel a stretch across your upper back.","Pull the handle to your belly button, driving elbows back and squeezing your shoulder blades together.","Return slowly to the full stretch without letting your torso get pulled forward."],avoid:"Rocking back and forth with your torso \u2014 your back angle should barely change."},dbohp:{steps:["Set the bench upright. Sit with your back fully against the pad, feet flat.","Start with dumbbells at shoulder height, palms forward, elbows under your wrists.","Press straight up until your arms lock out overhead.","Lower under control until the weights reach about ear level."],avoid:"Arching off the pad to press more weight \u2014 that turns it into a bad incline press."},pulldown:{steps:["Grip the bar slightly wider than shoulders, palms forward. Lock your thighs under the pads.","Lean back just a few degrees and lift your chest.","Pull the bar to your collarbone, leading with your elbows.","Control the bar all the way up until your arms are fully stretched."],avoid:"Rocking backward to yank the weight down, or pulling the bar behind your neck."},incline:{steps:["Set the bench to about 30\xB0 \u2014 one or two notches up, not halfway to vertical.","Start with dumbbells at the sides of your upper chest, elbows ~45\xB0 from your body.","Press up and slightly inward until your arms are straight above your upper chest.","Lower with control (~2 sec) until you feel a stretch across your chest."],avoid:"Setting the bench past ~45\xB0 \u2014 it becomes a shoulder press and your chest stops working."},dbcurl:{steps:["Stand tall, dumbbells at your sides, palms forward, elbows pinned to your ribs.","Curl the weights up by bending only at the elbow \u2014 upper arms stay still.","Squeeze hard for a beat at the top.","Lower slowly (~2 sec) to a full hang."],avoid:"Swinging your hips or leaning back to start the rep \u2014 go lighter and stricter."},pushdown:{steps:["Face the cable with the rope at the top. Elbows bent past 90\xB0 and pinned to your sides.","Push down until your arms are fully straight, splitting the rope apart at the bottom.","Hold the lockout for a beat \u2014 that's peak triceps tension.","Let the rope rise under control without your elbows drifting forward."],avoid:"Letting your elbows float forward or leaning your bodyweight onto the cable."},facepull:{steps:["Set the cable at face height with the rope. Grab the ends with thumbs pointing back at you.","Step back until your arms are straight and there's tension.","Pull toward your eyebrows, elbows high and wide, knuckles rotating toward the ceiling.","Pause with your upper back squeezed, then return slowly."],avoid:"Elbows dropping and turning it into a row \u2014 the elbows-high path is the whole point."},dbbench:{steps:["Sit on a flat bench with the dumbbells on your thighs, then kick them up as you lie back.","Start with arms straight above your chest, palms forward.","Lower until the dumbbells are level with your chest \u2014 go deeper than a bar allows.","Press up and slightly together until your arms lock out."],avoid:"Clanging the dumbbells together at the top and losing tension on your chest."},machrow:{steps:["Set the chest pad so your arms can fully extend without your chest lifting off it.","Grab the handles with arms straight, chest pressed into the pad.","Pull the handles back, driving your elbows past your ribs and squeezing your shoulder blades.","Return all the way to a full stretch, keeping your chest on the pad the whole time."],avoid:"Peeling your chest off the pad to pull heavier \u2014 the pad is what makes this strict."},machpress:{steps:["Adjust the seat so the handles sit at about shoulder height.","Sit with your back flat on the pad and grab the handles.","Press up until your arms are almost locked \u2014 don't slam the joint.","Lower slowly until your hands are back at shoulder level."],avoid:"Setting the seat too low, which forces your shoulders into an awkward overhead angle."},neutralpull:{steps:["Attach the close/neutral grip handle. Lock your thighs under the pads.","Sit tall, arms fully extended overhead.","Pull the handle to your upper chest, elbows driving down and back.","Return under control to a full overhead stretch."],avoid:"Using the same grip and path as the wide pulldown \u2014 this one should feel lower on your lats."},pecdeck:{steps:["Set the seat so the handles are at chest height and your feet are flat.","Grab the handles with a slight bend in your elbows \u2014 keep that bend fixed all rep.","Bring the handles together in front of your chest and squeeze for a beat.","Open slowly until you feel a stretch across your chest, but don't let the weight yank your shoulders back."],avoid:"Bending and straightening your elbows \u2014 that turns a fly into a press."},ezcurl:{steps:["Grab the EZ bar at the angled sections, palms up, elbows at your sides.","Stand tall with a slight knee bend, arms fully straight.","Curl the bar up by bending at the elbows only.","Lower slowly to full extension every rep."],avoid:"Letting your elbows drift forward at the top \u2014 that gives your shoulders the work."},ohext:{steps:["Set the cable low with a rope. Face away, rope pulled up behind your head.","Step forward into a staggered stance, elbows pointing up and forward beside your ears.","Extend your arms overhead until straight, spreading the rope.","Lower slowly behind your head for a deep triceps stretch."],avoid:"Letting your elbows flare wide \u2014 keep them narrow so the triceps do the work."},lateral:{steps:["Stand with light dumbbells at your sides, slight bend in the elbows.","Raise the weights out to your sides, leading with your elbows, not your hands.","Stop when your arms reach shoulder height \u2014 no higher.","Lower slowly, taking about 3 seconds down."],avoid:"Going too heavy and swinging \u2014 this is the one lift where ego costs you the most."},smithsquat:{steps:["Set the bar on your upper traps and position your feet slightly in FRONT of the bar (the rails let you do this safely).","Unhook, take a big breath, and brace your core.","Sit down and back until your thighs reach at least parallel.","Drive up through your whole foot, knees tracking over your toes."],avoid:"Standing with feet directly under the bar \u2014 it forces your knees forward and strains them."},smithrdl:{steps:["Set the bar at hip height, grip just outside your thighs, feet hip width, knees slightly bent.","Unhook and stand tall.","Push your hips straight back, letting the bar slide down your thighs, back flat.","Lower to mid-shin where you feel the hamstring stretch, then drive your hips forward to stand."],avoid:"Bending your knees more as you lower \u2014 that's a squat. The knee angle stays fixed."},legpress:{steps:["Sit with your back and hips flat against the pad, feet shoulder width at mid-platform.","Release the safeties and lower until your knees reach about 90\xB0 or slightly deeper.","Stop before your hips curl off the pad.","Press through your whole foot until your legs are nearly straight \u2014 don't slam lockout."],avoid:"Loading it up for tiny half reps \u2014 depth builds legs, plate count doesn't."},legpressheavy:{steps:["Same setup, but place your feet LOWER on the platform to bias your quads.","Lower under control until your knees reach about 90\xB0.","Because the load is heavier here, keep the range slightly shorter and strict.","Press up through the balls and heels evenly."],avoid:"Letting your knees cave inward under the heavier load \u2014 push them out as you press."},dbrdl:{steps:["Hold a dumbbell in each hand in front of your thighs, feet hip width, knees slightly bent.","Push your hips back and lower the dumbbells along the front of your legs.","Go until you feel a strong hamstring stretch \u2014 dumbbells let you go deeper than the Smith.","Squeeze your glutes to stand tall without leaning back."],avoid:"Letting the dumbbells drift away from your legs \u2014 that loads your lower back instead."},legext:{steps:["Set the back pad so your knee lines up with the machine's pivot point.","Hook your shins behind the roller, hands on the handles.","Straighten your legs fully and pause one second at the top.","Lower slowly \u2014 about 3 seconds \u2014 without letting the stack touch down."],avoid:"Kicking the weight up with a jerk \u2014 the top pause is where the quad work happens."},smithlunge:{steps:["Set the bar on your upper traps and unhook, standing under the rails.","Step one foot straight back and drop that knee toward the floor.","Front shin vertical, torso upright, weight through the front heel.","Push through the front foot to return, then repeat on the same leg or alternate."],avoid:"Stepping back too short, which drives your front knee way past your toes."},seatedcurl:{steps:["Adjust the pad so it sits just above your heels, knee aligned with the pivot.","Lock the thigh pad down so your legs can't lift.","Curl your heels toward your glutes as far as the machine allows.","Squeeze one second, the
